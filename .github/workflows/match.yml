name: match

# Сопоставление товаров между магазинами (FR-37…FR-39) и раскладка по категориям (FR-42): после ночных парсеров и вручную (например, после решений админа).
on:
  workflow_run:
    workflows: [scrape]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: match
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Сбой одного парсера не повод не пересчитывать остальные, поэтому запускаем и после неуспешного scrape.
      - run: pnpm --filter @bestprice/matcher match
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Gemini помогает с брендом и советами; без ключа или при сбое матчер работает с кэшем. Потолок запросов за запуск.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MAX_REQUESTS: 30
      # Категории для фильтра (offers.cat) раскладывает словарь, без Gemini и без квот. Запускаем и после сбоя match: категории от него не зависят.
      - if: ${{ !cancelled() }}
        run: pnpm --filter @bestprice/matcher categorize
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Категории аптек (pharmacy.products.cat) тем же словарём. Раньше их ставили вручную, и на боевой базе они были пустыми.
      - if: ${{ !cancelled() }}
        run: pnpm --filter @bestprice/matcher categorize --pharmacy
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Группы «один товар в нескольких аптеках» (pharmacy.products.group_id, group_rep): общий штрихкод или ключ названия (бренд, размер, число штук, слова).
      - if: ${{ !cancelled() }}
        run: pnpm --filter @bestprice/matcher pharmacy-groups
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
