name: scrape

on:
  schedule:
    # 22:17 UTC = 00:17 в Риге зимой, 01:17 летом (cron в GitHub только по UTC).
    # GitHub опаздывает на 5–6 часов, поэтому запуск ночью: к утру данные есть.
    # Минута 17, а не 0: круглые часы самые загруженные.
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Какой парсер запустить
        type: choice
        default: all
        options: [all, lidl, maxima, barbora, e-latts, rimi, etop, meness, euroaptieka, benu, apotheka]

# Один запуск за раз: двойной клик по кнопке в админке не даст двух одинаковых парсеров.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  # Lidl читается только по буклету: в буклете 240+ акций, на сайте ~70 (docs/PLAN.md, «Буклеты магазинов»). Gemini читает страницы-картинки.
  # Запуск идемпотентный: прочитанные страницы пропускаются без квоты, поэтому ночной запуск каждый день сам подхватывает новый буклет
  # (Lidl выкладывает следующий с пятницы), а упавший на квоте дочитывается на следующую ночь.
  lidl:
    if: github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == 'lidl'
    runs-on: ubuntu-latest
    # Основная модель gemini-3.5-flash читает страницу ≈60 с: буклет ≈45 минут, два буклета ≈90, запас вдвое.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ненулевой код выхода при сбое → job падает → GitHub шлёт письмо (FR-15).
      - run: pnpm --filter @bestprice/scraper-lidl leaflet
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Суточный лимит бесплатного уровня 500 запросов, общий с матчером; два буклета ~85, потолок защищает от зацикливания.
          GEMINI_MAX_REQUESTS: 120
      # Сырые ответы модели по страницам (что она прочитала) сохраняем только при сбое (FR-30).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lidl-debug
          path: packages/scrapers/lidl/debug
          retention-days: 7

  maxima:
    if: github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == 'maxima'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bestprice/scraper-maxima scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maxima-debug
          path: packages/scrapers/maxima/debug
          retention-days: 7

  barbora:
    if: github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == 'barbora'
    runs-on: ubuntu-latest
    # Живой прогон: ≈20 запросов, около 8 секунд; запас с избытком.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bestprice/scraper-barbora scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: barbora-debug
          path: packages/scrapers/barbora/debug
          retention-days: 7

  # Интернет-аптека Mēness: весь каталог (≈10 200 товаров) в пяти ценовых диапазонах, ≈105 запросов по ≈3.7 МБ с паузой 0,4 с, живой прогон ≈5 минут (2026-11-01).
  # Если сайт начнёт блокировать адреса GitHub, магазин снимаем с сайта, а не обходим защиту (решение владельца).
  meness:
    if: github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == 'meness'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bestprice/scraper-meness scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: meness-debug
          path: packages/scrapers/meness/debug
          retention-days: 7

  # Интернет-аптека Euroaptieka: все карточки товаров из sitemap (≈6 600), ≈140 КБ каждая, 3 потока с паузой 0,25 с; живой прогон см. docs/PLAN.md (2026-11-01).
  # Если сайт начнёт блокировать адреса GitHub (403), магазин снимаем с сайта, а не обходим защиту (решение владельца).
  euroaptieka:
    if: github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == 'euroaptieka'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bestprice/scraper-euroaptieka scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: euroaptieka-debug
          path: packages/scrapers/euroaptieka/debug
          retention-days: 7

  # Интернет-аптека Benu: каталог в наличии (≈6 070 товаров) из открытого поиска Luigi's Box, 31 запрос по 200 с паузой 0,7 с, живой прогон ≈30 секунд (2026-11-01).
  # Сайт отвечал 429 при частых запросах (парсер повторяет с ожиданием). Если начнёт блокировать адреса GitHub (403), магазин снимаем с сайта, а не обходим защиту (решение владельца).
  benu:
    if: github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == 'benu'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bestprice/scraper-benu scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: benu-debug
          path: packages/scrapers/benu/debug
          retention-days: 7

  # Интернет-аптека Apotheka: ≈180 страниц списка (≈6 175 товаров, ответ ≈7 с) и ≈2 960 карточек товаров вне списков (рецептурные и не в наличии, ≈0,3 с), живой прогон ≈50 минут (2026-11-01).
  # Блокировку адресов GitHub не проверяли до слияния. Если начнёт блокировать (403), магазин снимаем с сайта, а не обходим защиту (решение владельца).
  apotheka:
    if: github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == 'apotheka'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bestprice/scraper-apotheka scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apotheka-debug
          path: packages/scrapers/apotheka/debug
          retention-days: 7

  # Раздел «Akcijas» интернет-магазина LaTS: ≈16 запросов с паузой 0,2 с, живой прогон ≈15 секунд (2026-10-31).
  e-latts:
    # Только вручную: e-latts.lv отвечает GitHub Actions 403 (блокирует адреса дата-центров, с ПК 200; запуск 2026-10-31). Ночью парсер идёт с ПК (FR-31, scripts/scrape-e-latts.ps1), в «all» не входит, чтобы не слать ночные письма о сбое.
    if: github.event_name == 'workflow_dispatch' && inputs.source == 'e-latts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bestprice/scraper-e-latts scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e-latts-debug
          path: packages/scrapers/e-latts/debug
          retention-days: 7

  rimi:
    if: github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == 'rimi'
    runs-on: ubuntu-latest
    # Первый прогон ≈50 минут (≈4 тыс. карточек по одной), дальше только новые товары; запас вдвое.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bestprice/scraper-rimi scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rimi-debug
          path: packages/scrapers/rimi/debug
          retention-days: 7

  etop:
    if: github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == 'etop'
    runs-on: ubuntu-latest
    # Живой прогон: 3 запроса, секунды; запас с избытком.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bestprice/scraper-etop scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: etop-debug
          path: packages/scrapers/etop/debug
          retention-days: 7
