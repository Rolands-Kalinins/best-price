name: scrape

on:
  schedule:
    # 22:17 UTC = 00:17 в Риге зимой, 01:17 летом (cron в GitHub только по UTC).
    # GitHub опаздывает на 5–6 часов, поэтому запуск ночью: к утру данные есть.
    # Минута 17, а не 0: круглые часы самые загруженные.
    - cron: "17 22 * * *"
  workflow_dispatch:

jobs:
  lidl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ненулевой код выхода при сбое → job падает → GitHub шлёт письмо (FR-15).
      - run: pnpm --filter @bestprice/scraper-lidl scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Сырой ответ магазина сохраняем только при сбое (FR-30).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lidl-debug
          path: packages/scrapers/lidl/debug
          retention-days: 7

  maxima:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bestprice/scraper-maxima scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maxima-debug
          path: packages/scrapers/maxima/debug
          retention-days: 7

  rimi:
    runs-on: ubuntu-latest
    # Первый прогон ≈50 минут (≈4 тыс. карточек по одной), дальше только новые товары; запас вдвое.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bestprice/scraper-rimi scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rimi-debug
          path: packages/scrapers/rimi/debug
          retention-days: 7

  etop:
    runs-on: ubuntu-latest
    # Живой прогон: 3 запроса, секунды; запас с избытком.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bestprice/scraper-etop scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wwccnhrzraqexagweocw.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: etop-debug
          path: packages/scrapers/etop/debug
          retention-days: 7
