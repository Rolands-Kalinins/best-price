name: ci

# Проверка каждого PR в main и каждой релизной ветки. Слияние в main делаем только при зелёной проверке.
on:
  pull_request:
    branches: [main]
  push:
    branches: ["release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Полная история: проверка версии и миграций сравнивает ветку с main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # Ключи Supabase для сборки не нужны: страницы с данными строятся при запросе.
      - run: pnpm build
      - name: Миграции и версия
        run: node scripts/release.mjs check origin/main | tee -a "$GITHUB_STEP_SUMMARY"
